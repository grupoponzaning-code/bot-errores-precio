name: Bot errores de precio

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub puede retrasarlo)
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar ofertas ya avisadas
        uses: actions/cache@v4
        with:
          path: vistos_gratis.json
          key: vistos-${{ github.run_id }}
          restore-keys: vistos-
      - run: pip install requests
      - name: Mensaje de prueba (solo al lanzarlo a mano)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="✅ Bot conectado. Aviso de bajadas desde el 50% en todas las tiendas de Chollometro." \
            | tee respuesta.json
          grep -q '"ok":true' respuesta.json
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python bot_errores_gratis.py --una-vez
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DESCUENTO_MIN: "50"
